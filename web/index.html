<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RADAR — Agregador inteligente de eventos de Ribeirão Preto">
    <link rel="icon" type="image/png" href="LogoLinka.png">
    <link rel="apple-touch-icon" href="LogoLinka.png">
    <title>RADAR — Ribeirão Preto</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg:          #F7F3EE;
    --bg-card:     #ffffff;
    --bg-input:    #ffffff;
    --bg-list:     #ffffff;
    --text:        #1A1A1A;
    --text-muted:  #555;
    --text-sec:    #777;
    --text-meta:   #999;
    --text-label:  #aaa;
    --border:      #E0DAD0;
    --border-card: #E0DAD0;
    --divider:     #F0EBE3;
    --item-hover:  #F7F3EE;
    --toggle-bg:   rgba(255,255,255,0.92);
    --accent:      #8547e4;
    --accent-glow: rgba(133,71,228,0.25);
    --stale-bg:    #FEF9E7;
    --stale-text:  #7D6608;
}

body.dark {
    --bg:          #0E0E14;
    --bg-card:     #1A1A26;
    --bg-input:    #1A1A26;
    --bg-list:     #1A1A26;
    --text:        #EDEDED;
    --text-muted:  #A0A0B8;
    --text-sec:    #8888AA;
    --text-meta:   #6B6B88;
    --text-label:  #6B6B88;
    --border:      #2E2E46;
    --border-card: #2E2E46;
    --divider:     #242438;
    --item-hover:  #22223A;
    --toggle-bg:   rgba(26,26,38,0.92);
    --accent:      #a07af0;
    --accent-glow: rgba(160,122,240,0.3);
    --stale-bg:    #2A1F0E;
    --stale-text:  #C8A04A;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    transition: background 0.35s ease, color 0.35s ease;
}

/* Banner stale */
.stale-banner {
    background: var(--stale-bg);
    border-left: 4px solid #E67E22;
    color: var(--stale-text);
    padding: 10px 20px;
    font-size: 14px;
    font-style: italic;
    text-align: center;
}

/* Header */
header {
    padding: 32px 24px 0;
    max-width: 1200px;
    margin: 0 auto;
}
.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}
.linka-logo {
    height: 150px;
    width: auto;
    object-fit: contain;
    opacity: 0.9;
}
.logo {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(42px, 8vw, 80px);
    font-weight: 900;
    color: #8547e4;
    letter-spacing: -2px;
    line-height: 1;
    opacity: 0;
    transform: translateY(-16px);
    animation: logoEntrada 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
}
@keyframes logoEntrada {
    from { opacity: 0; transform: translateY(-16px) scale(0.96); letter-spacing: 8px; }
    to   { opacity: 1; transform: translateY(0) scale(1); letter-spacing: -2px; }
}
.logo-bullet {
    display: inline-block;
    animation: bulletPulse 2s ease-in-out 0.9s infinite;
    color: #8547e4;
}
@keyframes bulletPulse {
    0%, 100% { transform: scale(1);   opacity: 1;   }
    50%       { transform: scale(1.3); opacity: 0.7; }
}
.sub {
    font-size: 13px;
    color: var(--text-label);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 6px;
}
.rule {
    height: 3px;
    background: #8547e4;
    margin: 16px 0 24px;
    transform-origin: left;
    animation: drawRule 0.6s ease forwards;
}
@keyframes drawRule { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* ── Filtros dropdown ── */
.filtros-wrapper {
    max-width: 1200px;
    margin: 0 auto 28px;
    padding: 0 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-items: start;
}

.filtro-grupo {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.filtro-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-label);
    font-family: 'Outfit', sans-serif;
}

.custom-select {
    position: relative;
    width: 100%;
}
.cs-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 10px 16px 10px 20px;
    background: var(--bg-input);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(133,71,228,0.06);
    transition: border-color 0.2s, box-shadow 0.2s, background 0.35s, color 0.35s;
    text-align: left;
}
.cs-trigger:hover {
    border-color: #8547e4;
}
.custom-select.open .cs-trigger {
    border-color: #8547e4;
    box-shadow: 0 0 0 3px rgba(133,71,228,0.12);
}
.cs-arrow {
    flex-shrink: 0;
    transition: transform 0.2s ease;
    color: #8547e4;
}
.custom-select.open .cs-arrow {
    transform: rotate(180deg);
}
.cs-list {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--bg-list);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    z-index: 200;
    overflow: hidden;
    max-height: 260px;
    overflow-y: auto;
}
.cs-list::-webkit-scrollbar { width: 4px; }
.cs-list::-webkit-scrollbar-track { background: transparent; }
.cs-list::-webkit-scrollbar-thumb { background: #E0DAD0; border-radius: 2px; }
.custom-select.open .cs-list {
    display: block;
    animation: csOpen 0.15s ease;
}
@keyframes csOpen {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
}
.cs-item {
    padding: 10px 20px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s;
    list-style: none;
}
.cs-item:first-child { padding-top: 12px; }
.cs-item:last-child  { padding-bottom: 12px; }
.cs-item:hover { background: var(--item-hover); }
.cs-item.ativo { color: #8547e4; font-weight: 600; }

@media (max-width: 600px) {
    .filtros-wrapper {
        grid-template-columns: 1fr;
    }
}

/* Grid */
.grid {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 48px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
}
@media (min-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 960px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
    .grid .card:first-child {
        grid-column: span 2;
    }
}

/* Card */
.card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: 16px;
    padding: 20px;
    transition: transform 0.2s, box-shadow 0.2s, background 0.35s, border-color 0.35s;
    cursor: pointer;
    perspective: 600px;
    opacity: 0;
    transform: translateY(24px);
}
.card.visivel {
    animation: cardEntrada 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes cardEntrada {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
}
.card:hover {
    transform: rotateY(3deg) translateY(-4px);
    box-shadow: -6px 8px 24px rgba(133,71,228,0.14);
}
.badge {
    display: inline-block;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #fff;
    border-radius: 2px;
    margin-bottom: 10px;
}
.card h2 {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(16px, 2.5vw, 22px);
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 8px;
    color: var(--text);
}
.meta {
    font-size: 12px;
    color: var(--text-meta);
    letter-spacing: 0.5px;
    margin-bottom: 10px;
}
.narrativa {
    font-size: 14px;
    color: var(--text-muted);
    font-style: italic;
    line-height: 1.5;
    border-top: 1px solid var(--divider);
    padding-top: 10px;
    margin-top: 8px;
}

/* Vazio */
.vazio {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-label);
    font-family: 'Outfit', sans-serif;
    font-size: 20px;
}

main, header { position: relative; z-index: 1; }
.filtros-wrapper, .busca-wrapper { position: relative; z-index: 50; }

/* ── Busca ── */
.busca-wrapper {
    max-width: 1200px;
    margin: 0 auto 20px;
    padding: 0 24px;
    display: flex;
    justify-content: center;
}
.busca-grupo {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.busca-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-label);
    font-family: 'Outfit', sans-serif;
    text-align: center;
}
.busca-input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}
.busca-input {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 10px 40px 10px 20px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg-input);
    transition: border-color 0.2s, box-shadow 0.2s, background 0.35s, color 0.35s;
    box-shadow: 0 2px 8px rgba(91,45,142,0.06);
}
.busca-input::placeholder { color: var(--text-label); }
.busca-input:focus {
    outline: none;
    border-color: #8547e4;
    box-shadow: 0 0 0 3px rgba(91, 45, 142, 0.12);
}
.busca-clear {
    position: absolute;
    right: 14px;
    background: none;
    border: none;
    cursor: pointer;
    color: #bbb;
    font-size: 18px;
    line-height: 1;
    display: none;
    padding: 4px;
    transition: color 0.2s;
}
.busca-clear:hover { color: #8547e4; }
.busca-clear.visible { display: block; }
@media (max-width: 600px) { .busca-grupo { max-width: 100%; } }

/* Toggle dark/light mode estilo iOS */
#theme-toggle-wrap {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 9998;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--toggle-bg);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px 8px 12px;
    box-shadow: 0 4px 20px rgba(133,71,228,0.15);
    backdrop-filter: blur(8px);
    user-select: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease, background 0.35s, border-color 0.35s;
}
#theme-toggle-icon {
    font-size: 16px;
    line-height: 1;
    transition: transform 0.3s ease;
}
#theme-toggle-track {
    position: relative;
    width: 48px;
    height: 28px;
    border-radius: 999px;
    background: #D1C4E9;
    cursor: pointer;
    transition: background 0.3s ease;
    flex-shrink: 0;
}
#theme-toggle-track.dark {
    background: #8547e4;
}
#theme-toggle-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
}
#theme-toggle-track.dark #theme-toggle-thumb {
    transform: translateX(20px);
}

/* ── Chatbot ── */
.chat-bubble {
    position: fixed;
    bottom: 28px;
    left: 28px;
    z-index: 9998;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 20px var(--accent-glow);
    transition: transform 0.2s, box-shadow 0.2s;
    opacity: 0;
    pointer-events: none;
}
.chat-bubble.visivel {
    opacity: 1;
    pointer-events: auto;
}
.chat-bubble:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 28px var(--accent-glow);
}
.chat-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 14px;
    height: 14px;
    background: #E63946;
    border-radius: 50%;
    display: none;
    border: 2px solid var(--bg);
}
.chat-badge.visible { display: block; }

.chat-window {
    position: fixed;
    bottom: 92px;
    left: 28px;
    z-index: 9998;
    width: 340px;
    max-height: 480px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    transform: translateY(16px) scale(0.96);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
}
.chat-window.aberto {
    transform: translateY(0) scale(1);
    opacity: 1;
    pointer-events: all;
}
.chat-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
}
.chat-header-info {
    display: flex;
    align-items: center;
    gap: 10px;
}
.chat-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #fff;
    flex-shrink: 0;
}
.chat-header-name {
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
}
.chat-header-status {
    font-size: 11px;
    color: #2DC653;
}
.chat-close {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 22px;
    line-height: 1;
    padding: 4px;
    transition: color 0.2s;
}
.chat-close:hover { color: var(--text); }

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
}
.chat-msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    animation: msgEntrada 0.2s ease forwards;
}
@keyframes msgEntrada {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
}
.chat-msg.bot {
    background: var(--item-hover);
    color: var(--text);
    border-bottom-left-radius: 4px;
    align-self: flex-start;
    border: 1px solid var(--border);
}
.chat-msg.user {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
    align-self: flex-end;
}
.chat-msg.digitando {
    background: var(--item-hover);
    color: var(--text-sec);
    align-self: flex-start;
    font-style: italic;
    border: 1px solid var(--border);
}
.chat-link {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 12px;
    background: var(--accent);
    color: #fff !important;
    text-decoration: none;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: opacity 0.2s, transform 0.2s;
}
.chat-link:hover {
    opacity: 0.85;
    transform: translateY(-1px);
}

.chat-suggestions {
    padding: 0 16px 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex-shrink: 0;
}
.chat-suggestion {
    background: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    color: var(--text-sec);
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    white-space: nowrap;
}
.chat-suggestion:hover {
    border-color: var(--accent);
    color: var(--accent);
}

.chat-input-wrapper {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
}
.chat-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, background 0.35s;
}
.chat-input:focus { border-color: var(--accent); }
.chat-input::placeholder { color: var(--text-label); }

.chat-send {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #fff;
    flex-shrink: 0;
    transition: transform 0.2s, opacity 0.2s;
}
.chat-send:hover { transform: scale(1.1); }
.chat-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

@media (max-width: 480px) {
    .chat-window { left: 12px; right: 12px; width: auto; bottom: 88px; }
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
@keyframes bulletPulseLoad {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.6; transform: scale(1.2); }
}
#bullet-loading { display: inline-block; animation: bulletPulseLoad 2s ease-in-out infinite; }
#txt-carregando { animation: piscarLoad 1.5s ease-in-out infinite; }
@keyframes piscarLoad {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
}
</style>
</head>
<body>
<div id="loading-screen" style="position:fixed;inset:0;z-index:9999;background:#080808 url('ceuestrelado.svg') center/cover no-repeat;">
    <div id="canvas-container" style="position:fixed;inset:0;z-index:1;"></div>
    <div id="loading-ui" style="
        position:relative;z-index:10;
        display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        height:100vh;gap:12px;
        opacity:0;transition:opacity 1s ease;
        font-family:'Outfit',sans-serif;
    ">
        <h1 style="font-size:clamp(40px,8vw,72px);font-weight:900;color:#F0EDE8;letter-spacing:-2px;">
            <span id="bullet-loading" style="color:#8547e4;">●</span> RADAR
        </h1>
        <p style="font-size:11px;color:#e0d8f0;letter-spacing:4px;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,0.8);">
            Ribeirão Preto e Região
        </p>
        <p id="txt-carregando" style="font-size:12px;color:#c8b8f0;letter-spacing:3px;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,0.8);">
            Carregando eventos...
        </p>
    </div>
</div>

<header>
    <div class="header-top">
        <h1 class="logo"><span class="logo-bullet">●</span> RADAR</h1>
        <img src="linka.png" alt="LINKA" class="linka-logo">
    </div>
    <p class="sub">Ribeirão Preto &nbsp;·&nbsp; Edição <span id="data-edicao"></span></p>
    <div class="rule"></div>
</header>

<div class="busca-wrapper">
    <div class="busca-grupo">
        <label class="busca-label" for="busca-input">Buscar evento</label>
        <div class="busca-input-wrapper">
            <input
                type="text"
                id="busca-input"
                class="busca-input"
                placeholder="Buscar evento ou artista..."
                oninput="aplicarFiltros()"
                autocomplete="off"
            >
            <button class="busca-clear" id="busca-clear" onclick="limparBusca()" title="Limpar">×</button>
        </div>
    </div>
</div>

<div class="filtros-wrapper">
    <div class="filtro-grupo">
        <label class="filtro-label">Tipo de evento</label>
        <div class="custom-select" id="cs-cat" data-value="todos">
            <button class="cs-trigger" type="button">
                <span class="cs-value">Todos os tipos</span>
                <svg class="cs-arrow" width="12" height="8" viewBox="0 0 12 8" fill="none"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <ul class="cs-list">
                <li class="cs-item ativo" data-value="todos">Todos os tipos</li>

<p id="count-label" style="max-width:1200px;margin:-16px auto 20px;padding:0 24px;font-size:11px;color:#aaa;font-family:'Outfit',sans-serif;">

<main class="grid" id="grid-eventos"></main>

<script>
// Data da edição
(function() {
    const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    const hoje = new Date();
    const el = document.getElementById('data-edicao');
    if (el) el.textContent = hoje.getDate() + ' de ' + meses[hoje.getMonth()] + ' de ' + hoje.getFullYear();
})();

const BADGE_CORES = {
    'Show':        '#C0392B',
    'Festa':       '#6C3483',
    'Feira':       '#1E8449',
    'Festival':    '#B7770D',
    'Teatro':      '#1A5276',
    'Esporte':     '#0E6655',
    'Corporativo': '#7F8C8D',
    'Curso':       '#1A6B8A',
    'Exposição':   '#884EA0',
    'Religioso':   '#A04000',
    'Turismo':     '#1D8348',
    'Infantil':    '#CB4335',
    'Outro':       '#95A5A6',
};

let _todosEventos = [];

function formatarData(iso) {
    if (!iso) return 'Data a confirmar';
    try {
        const [a, m, d] = iso.split('-');
        return d + '/' + m + '/' + a;
    } catch(e) { return iso; }
}

function gerarCard(ev) {
    const cat    = ev.categoria || 'Outro';
    const cor    = BADGE_CORES[cat] || '#95A5A6';
    const titulo = (ev.titulo || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const local  = (ev.local  || 'Ribeirão Preto').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const data   = formatarData(ev.data_iso);
    const narr   = (ev.narrativa_ia || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const url    = ev.url || '#';
    const cidade = ev.cidade || 'Ribeirão Preto';
    const art = document.createElement('article');
    art.className = 'card';
    art.dataset.cat    = cat;
    art.dataset.cidade = cidade;
    art.onclick = () => window.open(url, '_blank');
    art.innerHTML =
        '<span class="badge" style="background:' + cor + '">' + cat + '</span>' +
        '<h2>' + titulo + '</h2>' +
        '<p class="meta">' + data + ' &nbsp;·&nbsp; ' + local + '</p>' +
        (narr ? '<p class="narrativa">' + narr + '</p>' : '');
    return art;
}

const observadorCards = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
            setTimeout(() => entry.target.classList.add('visivel'), i * 60);
            observadorCards.unobserve(entry.target);
        }
    });
}, { threshold: 0.08 });

function renderizarGrid(eventos) {
    const grid = document.getElementById('grid-eventos');
    if (!grid) return;
    grid.innerHTML = '';
    if (!eventos.length) {
        grid.innerHTML = '<p class="vazio">Nenhum evento encontrado.</p>';
        const label = document.getElementById('count-label');
        if (label) label.textContent = '0 eventos';
        return;
    }
    eventos.forEach(ev => {
        const card = gerarCard(ev);
        grid.appendChild(card);
        observadorCards.observe(card);
    });
    const label = document.getElementById('count-label');
    if (label) label.textContent = eventos.length + ' evento' + (eventos.length !== 1 ? 's' : '');
}

function popularDropdowns(eventos) {
    const cats    = {};
    const cidades = {};
    eventos.forEach(ev => {
        const c  = ev.categoria || 'Outro';
        const ci = ev.cidade    || 'Ribeirão Preto';
        cats[c]   = (cats[c]   || 0) + 1;
        cidades[ci] = (cidades[ci] || 0) + 1;
    });

    const csCat    = document.getElementById('cs-cat');
    const csCidade = document.getElementById('cs-cidade');
    const listCat    = csCat    ? csCat.querySelector('.cs-list')    : null;
    const listCidade = csCidade ? csCidade.querySelector('.cs-list') : null;

    const catAtual    = csCat    ? (csCat.dataset.value    || 'todos')  : 'todos';
    const cidadeAtual = csCidade ? (csCidade.dataset.value || 'todas') : 'todas';

    if (listCat) {
        const atoC = catAtual === 'todos' ? ' ativo' : '';
        let h = '<li class="cs-item' + atoC + '" data-value="todos">Todos os tipos</li>';
        Object.keys(cats).sort().forEach(c => {
            const ativo = catAtual === c ? ' ativo' : '';
            h += '<li class="cs-item' + ativo + '" data-value="' + c.replace(/"/g,'&quot;') + '">' + c + ' (' + cats[c] + ')</li>';
        });
        listCat.innerHTML = h;
    }

    if (listCidade) {
        const atoD = cidadeAtual === 'todas' ? ' ativo' : '';
        let h = '<li class="cs-item' + atoD + '" data-value="todas">Todas as cidades</li>';
        Object.keys(cidades).sort().forEach(ci => {
            const ativo = cidadeAtual === ci ? ' ativo' : '';
            h += '<li class="cs-item' + ativo + '" data-value="' + ci.replace(/"/g,'&quot;') + '">' + ci + ' (' + cidades[ci] + ')</li>';
        });
        listCidade.innerHTML = h;
    }
}

function aplicarFiltros() {
    const cat    = document.getElementById('cs-cat')?.dataset.value    || 'todos';
    const cidade = document.getElementById('cs-cidade')?.dataset.value || 'todas';
    const busca  = (document.getElementById('busca-input')?.value || '')
                    .toLowerCase()
                    .normalize('NFD')
                    .replace(/[̀-ͯ]/g, '');
    const btnClear = document.getElementById('busca-clear');
    if (btnClear) btnClear.classList.toggle('visible', busca.length > 0);

    const filtrados = _todosEventos.filter(ev => {
        const catOk    = cat    === 'todos' || (ev.categoria || 'Outro') === cat;
        const cidadeOk = cidade === 'todas' || (ev.cidade    || 'Ribeirão Preto') === cidade;
        let buscaOk = true;
        if (busca.length > 0) {
            const texto = ((ev.titulo || '') + ' ' + (ev.local || '') + ' ' + (ev.narrativa_ia || ''))
                .toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
            buscaOk = texto.includes(busca);
        }
        return catOk && cidadeOk && buscaOk;
    });

    renderizarGrid(filtrados);
}

function limparBusca() {
    const input = document.getElementById('busca-input');
    if (input) { input.value = ''; input.focus(); }
    aplicarFiltros();
}

async function carregarEventos() {
    try {
        const resp = await fetch('events.json?v=' + Date.now());
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        _todosEventos = await resp.json();
        popularDropdowns(_todosEventos);
        aplicarFiltros();
    } catch(e) {
        const grid = document.getElementById('grid-eventos');
        if (grid) grid.innerHTML = '<p class="vazio">Erro ao carregar eventos. Tente recarregar a página.</p>';
        const label = document.getElementById('count-label');
        if (label) label.textContent = '0 eventos';
    }
}

// Dropdowns customizados — event delegation
(function() {
    document.querySelectorAll('.custom-select').forEach(cs => {
        const trigger = cs.querySelector('.cs-trigger');
        const valueEl = cs.querySelector('.cs-value');
        const list    = cs.querySelector('.cs-list');

        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.custom-select.open').forEach(o => { if (o !== cs) o.classList.remove('open'); });
            cs.classList.toggle('open');
        });

        list.addEventListener('click', (e) => {
            const item = e.target.closest('.cs-item');
            if (!item) return;
            list.querySelectorAll('.cs-item').forEach(i => i.classList.remove('ativo'));
            item.classList.add('ativo');
            valueEl.textContent = item.textContent;
            cs.dataset.value = item.dataset.value;
            cs.classList.remove('open');
            aplicarFiltros();
        });
    });

    document.addEventListener('click', () => {
        document.querySelectorAll('.custom-select.open').forEach(o => o.classList.remove('open'));
    });
})();

carregarEventos();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.getElementById('loading-screen').style.display = 'none';
        return;
    }

    const scene    = new THREE.Scene();
    const camera   = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    camera.position.z = 4;

    // Texturas
    const loader   = new THREE.TextureLoader();
    const nightmap = loader.load('textures/nightmap.jpg');
    const specular = loader.load('textures/specular.png');


    // Camada 1 — base do planeta (oceanos): preto-azulado fosco, sem reflexo
    const planetMat = new THREE.MeshPhongMaterial({
        color:    new THREE.Color(0x050505),
        specular: new THREE.Color(0x000000),
        shininess: 0,
    });
    const planet = new THREE.Mesh(new THREE.SphereGeometry(1.5, 64, 64), planetMat);
    scene.add(planet);

    // Camada 2 — países em roxo via emissiveMap (specular.png invertido)
    const countriesMat = new THREE.MeshPhongMaterial({
        color:             new THREE.Color(0x000000),
        emissive:          new THREE.Color(0x8547e4),
        emissiveIntensity: 0.9,
        specular:          new THREE.Color(0x000000),
        shininess:         0,
        transparent:       true,
        depthWrite:        false,
    });
    const countriesMesh = new THREE.Mesh(new THREE.SphereGeometry(1.501, 64, 64), countriesMat);
    planet.add(countriesMesh);

    // Processa specular.png: inverte pixels → terra=branco, oceano=preto
    loader.load('textures/specular.png', (specTex) => {
        const img = specTex.image;
        const c = document.createElement('canvas');
        c.width = img.width; c.height = img.height;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const d = ctx.getImageData(0, 0, c.width, c.height);
        for (let i = 0; i < d.data.length; i += 4) {
            d.data[i]   = 255 - d.data[i];
            d.data[i+1] = 255 - d.data[i+1];
            d.data[i+2] = 255 - d.data[i+2];
        }
        ctx.putImageData(d, 0, 0);
        countriesMat.emissiveMap = new THREE.CanvasTexture(c);
        countriesMat.needsUpdate = true;
    });

    // Camada 3 — luzes das cidades (nightmap aditivo, cores originais)
    const cityMat = new THREE.MeshBasicMaterial({
        map:         nightmap,
        blending:    THREE.AdditiveBlending,
        transparent: true,
        depthWrite:  false,
    });
    planet.add(new THREE.Mesh(new THREE.SphereGeometry(1.502, 64, 64), cityMat));


    // Iluminação — só ambiente suave, sem luz direcional (elimina reflexo solar)
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    // UI e fases
    const ui = document.getElementById('loading-ui');
    setTimeout(() => ui.style.opacity = '1', 1000);

    let zoomAtivo = false, zoomInicio = 0;
    setTimeout(() => {
        zoomAtivo = true;
        zoomInicio = Date.now();
        ui.style.opacity = '0';
    }, 3000);

    setTimeout(() => {
        const ls = document.getElementById('loading-screen');
        ls.style.transition = 'opacity 0.8s ease';
        ls.style.opacity = '0';
        setTimeout(() => {
            ls.style.display = 'none';
            const toggle = document.getElementById('theme-toggle-wrap');
            toggle.style.opacity = '1';
            toggle.style.pointerEvents = 'auto';
            document.getElementById('chat-bubble').classList.add('visivel');
        }, 800);
    }, 5500);

    (function animate() {
        requestAnimationFrame(animate);
        planet.rotation.y += 0.002;
        if (zoomAtivo) {
            const t = Math.min((Date.now() - zoomInicio) / 2500, 1);
            const e = t * t * (3 - 2 * t);
            camera.position.z = 4 - (3.92 * e);
        }
        renderer.render(scene, camera);
    })();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
})();
</script>

<!-- Chatbot -->
<button class="chat-bubble" id="chat-bubble" onclick="toggleChat()" title="Falar com o ORBIT">
    💬
    <span class="chat-badge" id="chat-badge"></span>
</button>

<div class="chat-window" id="chat-window">
    <div class="chat-header">
        <div class="chat-header-info">
            <div class="chat-avatar">🌌</div>
            <div>
                <div class="chat-header-name">ORBIT</div>
                <div class="chat-header-status">● online agora</div>
            </div>
        </div>
        <button class="chat-close" onclick="toggleChat()">×</button>
    </div>
    <div class="chat-messages" id="chat-messages">
        <div class="chat-msg bot">
            Olá! Sou o ORBIT 🌌 Seu guia de eventos em Ribeirão Preto e região. O que você procura?
        </div>
    </div>
    <div class="chat-suggestions" id="chat-suggestions">
        <button class="chat-suggestion" onclick="enviarSugestao(this)">Shows esse fim de semana</button>
        <button class="chat-suggestion" onclick="enviarSugestao(this)">Eventos em Campinas</button>
        <button class="chat-suggestion" onclick="enviarSugestao(this)">Eventos para crianças</button>
        <button class="chat-suggestion" onclick="enviarSugestao(this)">O que tem hoje?</button>
    </div>
    <div class="chat-input-wrapper">
        <input class="chat-input" id="chat-input" type="text"
            placeholder="Pergunte sobre eventos..."
            onkeydown="if(event.key==='Enter') enviarMensagem()">
        <button class="chat-send" id="chat-send" onclick="enviarMensagem()">➤</button>
    </div>
</div>

<div id="theme-toggle-wrap" title="Alternar tema">
    <span id="theme-toggle-icon">☀️</span>
    <div id="theme-toggle-track">
        <div id="theme-toggle-thumb"></div>
    </div>
</div>

<script>
(function () {
    const wrap  = document.getElementById('theme-toggle-wrap');
    const track = document.getElementById('theme-toggle-track');
    const icon  = document.getElementById('theme-toggle-icon');

    function applyTheme(dark) {
        document.body.classList.toggle('dark', dark);
        track.classList.toggle('dark', dark);
        icon.textContent = dark ? '🌙' : '☀️';
        localStorage.setItem('radar-theme', dark ? 'dark' : 'light');
    }

    const saved = localStorage.getItem('radar-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(saved ? saved === 'dark' : prefersDark);

    track.addEventListener('click', () => {
        applyTheme(!document.body.classList.contains('dark'));
    });
})();

// ── Chatbot ──
const chatHistory = [];
let chatAberto = false;

function toggleChat() {
    chatAberto = !chatAberto;
    const win   = document.getElementById('chat-window');
    const badge = document.getElementById('chat-badge');
    const btn   = document.getElementById('chat-bubble');
    win.classList.toggle('aberto', chatAberto);
    btn.innerHTML = (chatAberto ? '×' : '💬') + '<span class="chat-badge" id="chat-badge"></span>';
    if (chatAberto) {
        document.getElementById('chat-badge').classList.remove('visible');
        document.getElementById('chat-input').focus();
        document.getElementById('chat-suggestions').style.display =
            chatHistory.length > 0 ? 'none' : 'flex';
    }
}

function addMsg(texto, tipo) {
    const msgs = document.getElementById('chat-messages');
    const div  = document.createElement('div');
    div.className = 'chat-msg ' + tipo;

    if (tipo === 'bot') {
        let html = texto
            .replace(
                /\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,
                '<a href="$2" target="_blank" class="chat-link">$1 ↗</a>'
            )
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/\*([^*]+)\*/g, '<em>$1</em>')
            .replace(/\n/g, '<br>');
        div.innerHTML = html;
    } else {
        div.textContent = texto;
    }

    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
}

function enviarSugestao(btn) {
    document.getElementById('chat-input').value = btn.textContent;
    document.getElementById('chat-suggestions').style.display = 'none';
    enviarMensagem();
}

async function enviarMensagem() {
    const input = document.getElementById('chat-input');
    const send  = document.getElementById('chat-send');
    const texto = input.value.trim();
    if (!texto) return;

    input.value = '';
    send.disabled = true;
    document.getElementById('chat-suggestions').style.display = 'none';

    addMsg(texto, 'user');
    chatHistory.push({ role: 'user', content: texto });

    const typing = addMsg('Digitando...', 'digitando');

    try {
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: chatHistory })
        });
        const data = await res.json();
        typing.remove();

        const reply = data.reply || 'Desculpe, não consegui responder agora.';
        addMsg(reply, 'bot');
        chatHistory.push({ role: 'assistant', content: reply });

        if (!chatAberto) {
            document.getElementById('chat-badge').classList.add('visible');
        }
    } catch (err) {
        typing.remove();
        addMsg('Erro ao conectar. Tente novamente.', 'bot');
    }

    send.disabled = false;
    input.focus();
}
</script>
