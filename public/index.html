<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RADAR — Agregador inteligente de eventos de Ribeirão Preto">
    <link rel="icon" type="image/png" href="assets/images/LogoLinka.png">
    <link rel="apple-touch-icon" href="assets/images/LogoLinka.png">
    <title>RADAR — Ribeirão Preto</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="loading-screen">
    <div id="canvas-container"></div>
    <div id="loading-ui">
        <h1 class="loading-title">
            <span id="bullet-loading">●</span> RADAR
        </h1>
        <p class="loading-sub">Ribeirão Preto e Região</p>
        <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
        <p id="txt-carregando" aria-live="polite">Carregando eventos...</p>
    </div>
</div>

<header>
    <div class="header-top">
        <h1 class="logo"><span class="logo-bullet">●</span> RADAR</h1>
        <img src="assets/images/linka.png" alt="LINKA" class="linka-logo">
    </div>
    <p class="sub">Ribeirão Preto &nbsp;·&nbsp; Edição <span id="data-edicao"></span></p>
    <div class="rule"></div>
</header>

<div id="filtros-container">
    <div id="filtros-barra">
        <span id="count-label" class="pf-count">carregando...</span>
        <div id="pf-ativos-inline" class="pf-ativos-inline"></div>
        <button id="btn-filtros" onclick="togglePainelFiltros()" aria-expanded="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M6 12h12M9 18h6"/></svg>
            Filtros
            <span id="filtros-badge" class="filtros-badge" style="display:none">0</span>
        </button>
    </div>

    <div id="painel-filtros">
        <!-- Busca -->
        <div class="pf-busca-wrap">
        <svg class="pf-busca-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="busca-input" class="pf-busca-input" placeholder="Buscar evento, artista ou local..." oninput="aplicarFiltros()" autocomplete="off">
        <button class="pf-busca-clear" id="busca-clear" onclick="limparBusca()" title="Limpar">×</button>
    </div>

    <div class="pf-divider"></div>

    <!-- Chips de data -->
    <div class="pf-chips-row">
        <span class="pf-section-label">Quando</span>
        <div class="pf-chips" id="chips-data">
            <button class="pf-chip ativo" data-value="todos" aria-pressed="true">Todos</button>
            <button class="pf-chip" data-value="hoje" aria-pressed="false">Hoje</button>
            <button class="pf-chip" data-value="fds" aria-pressed="false">Fim de semana</button>
            <button class="pf-chip" data-value="semana" aria-pressed="false">Esta semana</button>
            <button class="pf-chip" data-value="mes" aria-pressed="false">Este mês</button>
        </div>
    </div>

    <div class="pf-divider"></div>

    <!-- Dropdowns + count -->
    <div class="pf-dropdowns-row">
        <div class="pf-drops">
            <div class="custom-select" id="cs-cat" data-value="todos">
                <button class="cs-trigger" type="button">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
                    <span class="cs-value">Todos os tipos</span>
                    <svg class="cs-arrow" width="11" height="7" viewBox="0 0 12 8" fill="none"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
                <ul class="cs-list"><li class="cs-item ativo" data-value="todos">Todos os tipos</li></ul>
            </div>
            <div class="custom-select" id="cs-cidade" data-value="todas">
                <button class="cs-trigger" type="button">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
                    <span class="cs-value">Todas as regiões</span>
                    <svg class="cs-arrow" width="11" height="7" viewBox="0 0 12 8" fill="none"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
                <ul class="cs-list"><li class="cs-item ativo" data-value="todas">Todas as regiões</li></ul>
            </div>
        </div>
    </div>

        <!-- Filtros ativos -->
        <div class="pf-ativos" id="pf-ativos" style="display:none">
            <div class="pf-ativos-chips" id="pf-ativos-chips"></div>
            <button class="pf-limpar-tudo" onclick="limparTodosFiltros()">Limpar tudo</button>
        </div>
    </div>
</div>

<main class="grid" id="grid-eventos"></main>

<!-- Chatbot -->
<button class="chat-bubble" id="chat-bubble" onclick="toggleChat()" title="Falar com o ORBIT" aria-label="Abrir chat com ORBIT">
    💬
    <span class="chat-badge" id="chat-badge"></span>
</button>

<div class="chat-window" id="chat-window">
    <div class="chat-header">
        <div class="chat-header-info">
            <div class="chat-avatar">🌌</div>
            <div>
                <div class="chat-header-name">ORBIT</div>
                <div class="chat-header-status">● online agora</div>
            </div>
        </div>
        <button class="chat-close" onclick="toggleChat()">×</button>
    </div>
    <div class="chat-messages" id="chat-messages">
        <div class="chat-msg bot">
            Olá! Sou o ORBIT 🌌 Seu guia de eventos em Ribeirão Preto e região. O que você procura?
        </div>
    </div>
    <div class="chat-suggestions" id="chat-suggestions">
        <button class="chat-suggestion" onclick="enviarSugestao(this)">Shows esse fim de semana</button>
        <button class="chat-suggestion" onclick="enviarSugestao(this)">Eventos em Campinas</button>
        <button class="chat-suggestion" onclick="enviarSugestao(this)">Eventos para crianças</button>
        <button class="chat-suggestion" onclick="enviarSugestao(this)">O que tem hoje?</button>
    </div>
    <div class="chat-input-wrapper">
        <input class="chat-input" id="chat-input" type="text"
            placeholder="Pergunte sobre eventos..."
            onkeydown="if(event.key==='Enter') enviarMensagem()">
        <button class="chat-send" id="chat-send" onclick="enviarMensagem()">➤</button>
    </div>
</div>

<div id="theme-toggle-wrap" title="Alternar tema">
    <span id="theme-toggle-icon">☀️</span>
    <div id="theme-toggle-track">
        <div id="theme-toggle-thumb"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/loading.js"></script>
<script src="js/theme.js"></script>
<script src="js/app.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
